mandatory=true
versionRange="[1.20.1-3.0.0.169,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aaa_particles"
mandatory=true
versionRange="[1.4.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="architectury"
mandatory=true
